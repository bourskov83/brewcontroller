services:
  influxdb:
    image: influxdb:2.7
    container_name: brew-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=changeme_admin_pw
      - DOCKER_INFLUXDB_INIT_ORG=brewery
      - DOCKER_INFLUXDB_INIT_BUCKET=brewery_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=changeme_admin_token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - brewery-net

  fuxa:
    build: ./fuxa
    container_name: brew-fuxa
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "1881:1881"
    volumes:
      - ./fuxa/fuxa-data/appdata:/usr/src/app/FUXA/server/_appdata
      - ./fuxa/fuxa-data/db:/usr/src/app/FUXA/server/_db
      - ./fuxa/fuxa-data/logs:/usr/src/app/FUXA/server/_logs
      - ./fuxa/fuxa-data/images:/usr/src/app/FUXA/server/_images
    environment:
      - NODE_ENV=production
    networks:
      - brewery-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  brewery-net:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config: